# /etc/nginx/sites-available/sixstar-staging  - a NEW, separate site. The production site file is never touched.
# HTTP only on purpose: certbot adds the HTTPS listener and the redirect for you (same as it did for production).
server {
    listen 80;
    listen [::]:80;
    server_name staging-api.sixstarsuppliers.com;

    client_max_body_size 5m;
    add_header X-Robots-Tag "noindex, nofollow" always;

    location / {
        proxy_pass http://127.0.0.1:5200;          # sixstar-staging (never the production slots)
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }
}
